# Copy this file to `config.ini` (gitignored) to point the analysis code at
# data on your machine. Every setting is optional -- omit a key to use the
# default. Environment variables take precedence over this file.

[paths]
# Root of the large upstream dataset that is NOT tracked in git: pickled
# session collections (Dill/) and raw Inscopix traces (Cell_Traces/).
# Only needed to regenerate data/processed from scratch; the paper figures
# run from the committed data/processed alone.
#
# Overridden by the DCA1_DATA_ROOT environment variable.
# Known lab mounts are detected automatically, so collaborators on the
# Ramirez lab share usually need nothing here.
#
# data_root = Z:/Home/rsenne/dCA1_Clean_Data
# data_root = /Volumes/rkc_ramirezlab/Home/rsenne/dCA1_Clean_Data

# Where notebooks write generated figures.
# Defaults to results/figures inside the repo (gitignored).
# Overridden by the DCA1_FIGURE_DIR environment variable.
#
# figure_dir = /Users/you/Desktop/dCA1_figures
